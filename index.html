<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://googleapis.com" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PASSWORD GENERATORE</h1>
        <div class="display-container">
             <input readonly placeholder="Password" class="display" data-passwordDisplay>
             <button  class="copyButton"  data-copy >
                <span class="tooltip"  data-copyMsg></span>
                <img src="./assets/copy.png" alt="copy" width="40" height="40">
             </button>
        </div>
        <div class="input-container">

            <!-- Password Length section -->
            <div class="length-container">
                <p>Password Length</p>
                <p data-lengthNumber>0</p>
            </div>

             <!-- Slider -->
            <input type="range" min="1" max="20" class="slider" step="1" data-lengthSlider >
            
            <!-- checkboxes -->
             <div class="check">
                <input type="checkbox" id="uppercase">
                <label for="uppercase">Includes Uppercase letters</label>
             </div>

              <div class="check">
                <input type="checkbox" id="lowercase">
                <label for="lowercase">Includes Lowercase letters</label>
             </div>
              <div class="check">
                <input type="checkbox" id="numbers">
                <label for="numbers">Includes Numbers letters</label>
             </div>
              <div class="check">
                <input type="checkbox" id="symbols">
                <label for="symbols">Includes Symbols letters</label>
             </div>
             <!-- strength section -->
              <div class="strength-container">
                <p>strength</p>
                <div class="indicator" data-indicator  ></div>
              </div>

               <!-- generatore password -->

               <button class="generateButton">GENERATORE PASSWORD</button>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
